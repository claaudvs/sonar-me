<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sonar Local: proyecto agregado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600&amp;display=swap">
<style>
body{margin:0;background:#F4F3FA}
a{color:#3F51B5}a:hover{color:#2A3990}
</style>
</helmet>
<div style="min-height: 760px; position: relative; background: #F4F3FA; color: #1B1B21; font-family: 'Roboto Flex', Roboto, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 20px">
  <div style="max-width: 880px; margin: 0 auto; padding: 40px 24px 120px; display: flex; flex-direction: column; gap: 20px">

    <header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 500">Proyectos</h1>
        <span style="display: inline-flex; align-items: center; gap: 8px; color: #45464F; font-size: 14px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2E8B57"></span>SonarQube en línea, 5 proyectos</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center">
        <a href="AddProject.dc.html" style="height: 40px; padding: 0 20px 0 16px; border-radius: 20px; border: 1px solid #767680; color: {{primary}}; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 4v10M4 9h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>Agregar</a>
        <button type="button" style="height: 40px; padding: 0 24px 0 16px; border-radius: 20px; border: 0; background: {{primary}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><path d="M5.5 3.6v10.8a.7.7 0 0 0 1.05.6l8.6-5.4a.7.7 0 0 0 0-1.2L6.55 3a.7.7 0 0 0-1.05.6Z"></path></svg>Escanear todos</button>
      </div>
    </header>

    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border-radius: 16px; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <li style="{{r.rowStyle}}">
          <div style="display: flex; align-items: center; gap: 16px; padding: 14px 16px 14px 24px; min-height: 72px; box-sizing: border-box">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
                <span style="font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px">{{r.name}}</span>
                <span style="{{r.chipStyle}}">
                  <sc-if value="{{r.isPass}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8.3 2.9 2.9 6-6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
                  <sc-if value="{{r.isFail}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></sc-if>
                  {{r.chip}}
                </span>
                <sc-if value="{{r.isNew}}" hint-placeholder-val="{{ false }}"><span style="height: 20px; padding: 0 8px; border-radius: 10px; background: {{primary}}; color: #FFFFFF; font-size: 11px; line-height: 20px; font-weight: 500; letter-spacing: 0.5px">Nuevo</span></sc-if>
              </div>
              <span style="font-size: 14px; line-height: 20px; color: #45464F; letter-spacing: 0.25px">{{r.sub}}</span>
            </div>
            <sc-if value="{{r.idle}}" hint-placeholder-val="{{ true }}">
              <button type="button" style="height: 40px; padding: 0 20px 0 16px; border-radius: 20px; border: 0; background: #DFE0FF; color: #0E1A63; font: inherit; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; flex: none"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><path d="M5.5 3.6v10.8a.7.7 0 0 0 1.05.6l8.6-5.4a.7.7 0 0 0 0-1.2L6.55 3a.7.7 0 0 0-1.05.6Z"></path></svg>Escanear</button>
            </sc-if>
            <sc-if value="{{r.scanning}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; align-items: center; gap: 12px; flex: none">
                <svg width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Escaneando"><circle cx="12" cy="12" r="9" fill="none" stroke="#DFE0FF" stroke-width="3"></circle><path d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="{{primary}}" stroke-width="3" stroke-linecap="round"></path></svg>
                <button type="button" style="height: 40px; padding: 0 20px; border-radius: 20px; border: 1px solid #767680; background: transparent; color: {{primary}}; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Cancelar</button>
              </div>
            </sc-if>
          </div>
          <sc-if value="{{r.scanning}}" hint-placeholder-val="{{ false }}">
            <div style="height: 4px; background: #DFE0FF"><div style="height: 4px; width: 18%; background: {{primary}}; border-radius: 0 2px 2px 0"></div></div>
          </sc-if>
        </li>
      </sc-for>
    </ul>
  </div>

  <div role="status" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); width: calc(100% - 48px); max-width: 560px; box-sizing: border-box; min-height: 48px; padding: 6px 8px 6px 16px; border-radius: 4px; background: #303036; color: #F2EFF7; display: flex; align-items: center; gap: 12px; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18)">
    <span style="flex: 1; font-size: 14px; line-height: 20px; letter-spacing: 0.25px">CustomerOffer se agregó y se creó en SonarQube</span>
    <button type="button" aria-label="Cerrar aviso" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #F2EFF7; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#3F51B5","options":["#3F51B5","#006A60","#8B4A00"]},"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const primary = this.props.primary ?? '#3F51B5';
    const chipBase = 'display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px 0 8px; border-radius: 8px; font-size: 13px; font-weight: 500; letter-spacing: 0.1px; ';
    const chips = {
      pass: { label: 'Aprobado', style: chipBase + 'background: #D3F0DC; color: #0F5130' },
      fail: { label: 'No aprobado', style: chipBase + 'background: #FFDAD6; color: #8C1D18' },
      none: { label: 'Sin análisis', style: chipBase + 'padding: 0 12px; background: transparent; color: #45464F; border: 1px solid #C6C5D0' },
      run: { label: 'Escaneando', style: chipBase + 'padding: 0 12px; background: #DFE0FF; color: #0E1A63' }
    };
    const data = [
      { name: 'Back Process BFF', gate: 'pass', sub: 'Último escaneo: 6 nov 2026, 10:42' },
      { name: 'Back Process Web Client', gate: 'pass', sub: 'Último escaneo: 6 nov 2026, 10:15' },
      { name: 'Credit Risk Assessment', gate: 'fail', sub: 'Último escaneo: 13 nov 2026, 18:02' },
      { name: 'BUM', gate: 'none', sub: 'Nunca escaneado' },
      { name: 'CustomerOffer', gate: 'run', sub: 'Preparando, paso 1 de 3', isNew: true }
    ];
    const rows = data.map((d, i) => {
      const scanning = d.gate === 'run';
      return {
        name: d.name, sub: d.sub, isNew: !!d.isNew,
        chip: chips[d.gate].label, chipStyle: chips[d.gate].style,
        isPass: d.gate === 'pass', isFail: d.gate === 'fail',
        idle: !scanning, scanning,
        rowStyle: (i === 0 ? '' : 'border-top: 1px solid #E4E1EC; ') + (d.isNew ? 'background: #F6F5FF' : '')
      };
    });
    return { primary, rows };
  }
}
</script>
</body>
</html>
